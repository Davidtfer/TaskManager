
services:
  backend:
    build: ./backend
    container_name: taskmanager-backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
      DB_USER: taskuser
      DB_PASSWORD: taskpass123
      DB_NAME: taskmanager
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    container_name: taskmanager-database
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: taskmanager
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpass123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass123"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
